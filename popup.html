<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, 'Hiragino Sans', sans-serif;
      font-size: 13px;
      color: #1d1d1f;
      background: #f8f8fa;
      padding: 16px;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 14px;
      text-align: center;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #86868b;
      margin-bottom: 4px;
    }
    .field { margin-bottom: 12px; }
    input[type="date"], input[type="number"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #0071e3; }
    .today-btn {
      display: inline-block;
      margin-left: 4px;
      padding: 2px 8px;
      background: #e8f0fe;
      color: #0071e3;
      border: none;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }
    .today-btn:hover { background: #d0e3fc; }
    .result-box {
      background: #fff;
      border: 1px solid #e5e5e7;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      margin-top: 14px;
    }
    .result-date {
      font-size: 24px;
      font-weight: 700;
      color: #0071e3;
      margin-bottom: 4px;
    }
    .result-detail {
      font-size: 12px;
      color: #86868b;
    }
    .result-weekday {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }
    .wd-sat { background: #e3f2fd; color: #1565c0; }
    .wd-sun { background: #fce4ec; color: #c62828; }
    .wd-week { background: #f5f5f5; color: #555; }
    .copy-result {
      margin-top: 10px;
      padding: 6px 14px;
      background: #fff;
      border: 1px solid #d2d2d7;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .copy-result:hover { background: #f0f0f2; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>📅 日数カウンター</h1>

  <div class="field">
    <label>基準日 <button class="today-btn" id="todayBtn">今日</button></label>
    <input type="date" id="baseDate">
  </div>

  <div class="field">
    <label>日数（＋未来 / −過去）</label>
    <input type="number" id="days" placeholder="例: 56" autofocus>
  </div>

  <div class="result-box hidden" id="resultBox">
    <div class="result-date" id="resultDate"></div>
    <div class="result-detail" id="resultDetail"></div>
    <div><span class="result-weekday" id="resultWeekday"></span></div>
    <button class="copy-result" id="copyBtn">📋 コピー</button>
  </div>

  <script>
    const baseDateEl = document.getElementById('baseDate');
    const daysEl = document.getElementById('days');
    const resultBox = document.getElementById('resultBox');
    const resultDate = document.getElementById('resultDate');
    const resultDetail = document.getElementById('resultDetail');
    const resultWeekday = document.getElementById('resultWeekday');
    const weekdays = ['日', '月', '火', '水', '木', '金', '土'];

    // 今日をセット
    function setToday() {
      const now = new Date();
      baseDateEl.value = formatISO(now);
    }
    document.getElementById('todayBtn').addEventListener('click', setToday);
    setToday();

    function formatISO(d) {
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function calc() {
      const base = baseDateEl.value;
      const days = parseInt(daysEl.value);
      if (!base || isNaN(days)) {
        resultBox.classList.add('hidden');
        return;
      }

      const baseD = new Date(base + 'T00:00:00');
      const result = new Date(baseD);
      result.setDate(result.getDate() + days);

      const y = result.getFullYear();
      const m = result.getMonth() + 1;
      const d = result.getDate();
      const wd = weekdays[result.getDay()];

      resultDate.textContent = m + '月' + d + '日（' + wd + '）';

      // 基準日からの差
      const diffMs = result - baseD;
      const diffDays = Math.round(diffMs / (1000*60*60*24));
      const direction = diffDays >= 0 ? '後' : '前';
      const absDays = Math.abs(diffDays);
      const weeks = Math.floor(absDays / 7);
      const remainDays = absDays % 7;
      let detail = y + '年' + m + '月' + d + '日 — ' + absDays + '日' + direction;
      if (weeks > 0) {
        detail += '（' + weeks + '週' + (remainDays > 0 ? remainDays + '日' : '') + '）';
      }
      resultDetail.textContent = detail;

      // 曜日色
      const dayOfWeek = result.getDay();
      resultWeekday.textContent = wd + '曜日';
      resultWeekday.className = 'result-weekday ' + (dayOfWeek === 0 ? 'wd-sun' : dayOfWeek === 6 ? 'wd-sat' : 'wd-week');

      resultBox.classList.remove('hidden');
    }

    baseDateEl.addEventListener('input', calc);
    daysEl.addEventListener('input', calc);

    // コピー
    document.getElementById('copyBtn').addEventListener('click', () => {
      const text = resultDate.textContent + ' ' + resultDetail.textContent;
      navigator.clipboard.writeText(text).then(() => {
        document.getElementById('copyBtn').textContent = '✓ コピー済み';
        setTimeout(() => { document.getElementById('copyBtn').textContent = '📋 コピー'; }, 1200);
      });
    });

    // 初期フォーカス
    daysEl.focus();
  </script>
</body>
</html>
